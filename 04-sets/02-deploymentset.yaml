apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: nginx-ds
  namespace: roboshop

spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      type: deploymentset
  template:
    metadata:
      labels:
        app: nginx
        type: deploymentset
    spec:
      containers:
      - name: deploymentset-cont
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1 
kind: Service 
metadata:
  name: deployment-service 
  namespace: roboshop
spec:
  type: LoadBalancer
  selector:                     #thsi labels and pod template labels should be same 
    app: nginx
    type: deploymentset
  ports:
  - protocol: TCP 
    port: 80 
    targetPort: 80