apiVersion: apps/v1
kind: ReplicaSet 
metadata:
  name: nginx-rs 
  namespace: roboshop
spec:
  replicas: 2
  selector:
    matchLabels:          #this labels should match the pod labels 
      app: nginx 
      type: replicaset
  template:
    metadata:
      labels:                             #this are pod labels 
        app: nginx
        type: replicaset
    spec:
      containers:
      - name: replicaset-cont
        image: nginx:mainline-alpine3.24-perl
        ports:
        - containerPort: 80
