apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-dynamic  #any name storage class name 
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-0fed6c8e985b846fd    ##we create EFS manually that efs id 
  directoryPerms: "700"
  gidRangeStart: "1000" # optional
  gidRangeEnd: "2000" # optional
  basePath: "/roboshop" # optional it is the root directory created in efs volume under this we will have seperate access points 

