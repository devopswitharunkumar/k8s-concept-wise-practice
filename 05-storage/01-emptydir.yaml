apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  labels:
    k8s-app: filebeat
data:
  filebeat.yml: |
    filebeat:
      config:
        modules:
          path: /usr/share/filebeat/modules.d/*.yml
          reload:
            enabled: true
      modules:
      - module: nginx
        access:
          var.paths: ["/var/log/nginx/access.log*"]
        error:
          var.paths: ["/var/log/nginx/error.log*"]
    output:
      elasticsearch:
        hosts: ["elasticsearch:9200"]
---
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: emptydir-ds
  namespace: roboshop 
  labels:  
    app: nginx
    type: emptydir

spec:
  replicas: 2
  selector: 
    matchLabels:
      app: nginx 
      type: emptydir 
  template:
    metadata:
      labels: 
        app: nginx
        type: emptydir
    spec:
      containers:
      - name: nginx-emptydir-cont 
        image: nginx 
        ports:
        - containerPort: 80 
        volumeMounts:
        - name: emptydir-vol 
          mountPath: /var/log/nginx
      - name: filebeat-cont
        image: docker.elastic.co/beats/filebeat:7.17.3  
        volumeMounts:
        - name: nginx-logs
          mountPath: /var/log/nginx
        - name: filebeat-config
          mountPath: /usr/share/filebeat/filebeat.yml
          subPath: filebeat.yml

      volumes:
      - name: emptydir-vol 
        emptyDir: {}
      - name: filebeat-config-emptydir
        configMap:
          name: filebeat-config
          items:
          - key: filebeat.yml
            path: filebeat.yml
