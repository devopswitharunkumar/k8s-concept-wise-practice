apiVersion: v1 
kind: Service
metadata:
  name: lb-service  
  namespace: roboshop
spec:
  type: LoadBalancer 
  selector:
    matchLabels:
      app: service
      type: lb 
    ports:
    - protocol: TCP 
      port: 8080
      targetPort: 80
---
apiVersion: v1 
kind: Pod 
metadata:
  name: lb-pod 
  namespace: roboshop
  labels:
    app: service
    type: lb 
spec:
  containers:
  - name: lb-cont 
    image: nginx:mainline-alpine3.24-perl
    ports:
    - containerPort: 80 