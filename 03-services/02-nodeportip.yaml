apiVersion: v1 
kind: Service 
metadata:
  name: nodeportip-service
  namespace: roboshop
spec:
  type: NodePort
  selector:
    app: service 
    type: nodeport  
  ports:
  - protocol: TCP 
    port: 80
    targetPort: 80 
    nodePort: 30080            #allocated range -- 30000 - 32767
---
apiVersion: v1 
kind: Pod 
metadata: 
  name: nodeportip-pod 
  namespace: roboshop
  labels:
    app: service 
    type: nodeport 
spec:
  containers:
  - name: nodeport-cont
    image: nginx:mainline-alpine3.24-perl
    ports:
    - containerPort: 80 